    <!-- Incident Card -->
    <rect x="20" y="85" width="280" height="348" rx="10" fill="rgba(239,68,68,0.08)" stroke="rgba(239,68,68,0.25)"/>
    <text x="36" y="120" fill="#EF4444" font-family="system-ui, sans-serif" font-size="14" font-weight="700">ALERT: EVIL TWIN DETECTED</text>
    <text x="36" y="145" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="13">Location: Faculty Lab Wing 2</text>
    <text x="36" y="170" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="13">Target SSID: UNIUYO-CAMPUS</text>
    <text x="36" y="195" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="13">Timestamp: 10:48:12 WAT</text>

    <line x1="36" y1="215" x2="264" y2="215" stroke="rgba(255,255,255,0.1)"/>

    <text x="36" y="245" fill="#D8B45C" font-family="system-ui, sans-serif" font-size="12" font-weight="600">AUTOMATED DISPATCHES</text>
    <text x="36" y="275" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12">✓ Faculty Admin Discord Webhook</text>
    <text x="36" y="300" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12">✓ Security Desk SMS Notification</text>
    <text x="36" y="325" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12">✓ CYB 411 Capstone Audit File</text>
    <text x="36" y="350" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12">✓ Triangulated Coordinates: R-204</text>

    <rect x="36" y="375" width="228" height="38" rx="6" fill="#009424"/>
    <text x="150" y="399" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12" font-weight="600">AUDIT VERIFIED BY FACULTY</text>
  </g>
</svg>
