<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#062A14"/>
      <stop offset="100%" stop-color="#02140A"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect width="1200" height="675" fill="url(#grid)"/>

  <!-- Top bar -->
  <rect x="60" y="40" width="1080" height="50" rx="12" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)"/>
  <circle cx="90" cy="65" r="6" fill="#EF4444"/>
  <circle cx="110" cy="65" r="6" fill="#F59E0B"/>
  <circle cx="130" cy="65" r="6" fill="#10B981"/>
  <text x="160" y="70" fill="#93C5AA" font-family="system-ui, sans-serif" font-size="14" font-weight="500">CYB 411 // Threat Monitor Sensor Grid - Faculty of Computing</text>
  <text x="1080" y="70" text-anchor="end" fill="#D8B45C" font-family="system-ui, sans-serif" font-size="12" font-weight="600" letter-spacing="1">LIVE TELEMETRY: 4 SENSORS ACTIVE</text>

  <!-- Left: Sensor Nodes -->
  <g transform="translate(80, 130)">
    <rect width="320" height="480" rx="16" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)"/>
    <text x="24" y="40" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="16" font-weight="600">Passive Sensor Nodes</text>
    <text x="24" y="62" fill="#75A88C" font-family="system-ui, sans-serif" font-size="12">802.11 Monitor Mode Ingestion</text>

    <!-- Node 1 -->
    <rect x="20" y="85" width="280" height="78" rx="10" fill="rgba(0,148,36,0.12)" stroke="rgba(0,148,36,0.3)"/>
    <circle cx="44" cy="124" r="8" fill="#10B981"/>
    <text x="64" y="118" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Node Alpha (Lab Wing 1)</text>
    <text x="64" y="138" fill="#75A88C" font-family="system-ui, sans-serif" font-size="12">CH 1, 6, 11 | 2400 MHz | 0 Drops</text>

    <!-- Node 2 -->
    <rect x="20" y="175" width="280" height="78" rx="10" fill="rgba(0,148,36,0.12)" stroke="rgba(0,148,36,0.3)"/>
    <circle cx="44" cy="214" r="8" fill="#10B981"/>
    <text x="64" y="208" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Node Beta (Main Concourse)</text>
    <text x="64" y="228" fill="#75A88C" font-family="system-ui, sans-serif" font-size="12">CH 36-165 | 5000 MHz | 0 Drops</text>

    <!-- Node 3 -->
    <rect x="20" y="265" width="280" height="78" rx="10" fill="rgba(0,148,36,0.12)" stroke="rgba(0,148,36,0.3)"/>
    <circle cx="44" cy="304" r="8" fill="#10B981"/>
    <text x="64" y="298" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Node Gamma (Auditorium A)</text>
    <text x="64" y="318" fill="#75A88C" font-family="system-ui, sans-serif" font-size="12">CH 1, 6, 11 | 2400 MHz | 0 Drops</text>

    <!-- Node 4 -->
    <rect x="20" y="355" width="280" height="78" rx="10" fill="rgba(239,68,68,0.15)" stroke="rgba(239,68,68,0.4)"/>
    <circle cx="44" cy="394" r="8" fill="#EF4444"/>
    <text x="64" y="388" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Node Delta (Cybersecurity Lab)</text>
    <text x="64" y="408" fill="#FCA5A5" font-family="system-ui, sans-serif" font-size="12">Rogue Beacon Flagged: &quot;UNIUYO-GUEST&quot;</text>
  </g>

  <!-- Center: Analysis Engine -->
  <g transform="translate(440, 130)">
    <rect width="320" height="480" rx="16" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)"/>
    <text x="24" y="40" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="16" font-weight="600">Cryptographic Engine</text>
    <text x="24" y="62" fill="#75A88C" font-family="system-ui, sans-serif" font-size="12">Edge Telemetry &amp; Verification</text>

    <rect x="20" y="85" width="280" height="110" rx="10" fill="rgba(216,180,92,0.08)" stroke="rgba(216,180,92,0.25)"/>
    <text x="36" y="115" fill="#D8B45C" font-family="system-ui, sans-serif" font-size="12" font-weight="600" letter-spacing="1">SIGNATURE EXTRACTION</text>
    <text x="36" y="140" fill="#E2E8F0" font-family="monospace" font-size="12">BSSID: 8C:AA:B5:12:3E:99</text>
    <text x="36" y="160" fill="#E2E8F0" font-family="monospace" font-size="12">OUI: Espressif Inc (Spoof)</text>
    <text x="36" y="180" fill="#F87171" font-family="monospace" font-size="12">Mismatch: Expected Cisco AP</text>

    <rect x="20" y="210" width="280" height="110" rx="10" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)"/>
    <text x="36" y="240" fill="#93C5AA" font-family="system-ui, sans-serif" font-size="12" font-weight="600" letter-spacing="1">HEURISTIC EVALUATION</text>
    <text x="36" y="265" fill="#E2E8F0" font-family="monospace" font-size="12">Signal: -48 dBm (High power)</text>
    <text x="36" y="285" fill="#E2E8F0" font-family="monospace" font-size="12">Beacon Interval: 102.4 ms</text>
    <text x="36" y="305" fill="#F59E0B" font-family="monospace" font-size="12">Risk Score: 94/100 (Critical)</text>

    <!-- Action Trigger -->
    <rect x="20" y="335" width="280" height="98" rx="10" fill="rgba(0,148,36,0.1)" stroke="rgba(0,148,36,0.25)"/>
    <text x="36" y="365" fill="#75A88C" font-family="system-ui, sans-serif" font-size="12" font-weight="600" letter-spacing="1">IMMUTABLE LOGGING</text>
    <text x="36" y="390" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12">SHA-256 Frame Audit Hash Recorded</text>
    <text x="36" y="412" fill="#93C5AA" font-family="system-ui, sans-serif" font-size="11">Zero packet injection verified</text>
  </g>

  <!-- Right: Dispatch & Alerting -->
  <g transform="translate(800, 130)">
    <rect width="320" height="480" rx="16" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)"/>
