# Lefthook configuration for NACOS UNIUYO Web Portal
# https://github.com/evilmartians/lefthook

pre-commit:
  parallel: true
  commands:
    typecheck:
      run: bun run typecheck
    lint:
      run: bun run lint
      stage_fixed: true

pre-push:
  parallel: false
  commands:
    build:
      run: bun run build
